<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Round 10: Reading status</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--muted:#888;--soft:#555;--line:#eee;--chip:#f3f3f3;--accent:#ff4500;--up:#16a34a;--down:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:#fff;color:var(--ink);padding-bottom:80px}
button{font:inherit;cursor:pointer}a{color:inherit;text-decoration:none}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px}
.sw{background:#111;color:#fff;font:600 13px Inter;position:sticky;top:0;z-index:60}
.sw .wrap{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding-top:10px;padding-bottom:10px}
.sw b{color:#aaa}.sw button{border:1px solid #444;background:#222;color:#ddd;border-radius:99px;padding:5px 12px;font-weight:700;font-size:12px}
.sw button.on{background:#ff4500;border-color:#ff4500;color:#fff}.sw .hint{color:#888;font-weight:500;margin-left:auto}
.desc{background:#fff7f2;border-bottom:1px solid #ffe0cc;font-size:14px;color:#7a3b17}.desc .wrap{padding-top:10px;padding-bottom:10px;line-height:1.5}
header{border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:32px;height:68px}
.logo{font:900 24px 'Inter Tight';letter-spacing:-1px}
.nav nav{display:flex;gap:24px;font-weight:600;font-size:15px;color:var(--soft)}
.nav nav a{padding:23px 0 21px;border-bottom:2px solid transparent}.nav nav a.on{color:var(--ink);border-bottom-color:var(--ink)}
.nav nav a.soon{color:#bbb}.nav nav small{font-size:10px;font-weight:700;margin-left:4px}
.nav .r{margin-left:auto;display:flex;gap:10px;align-items:center}
.btn{border:0;border-radius:99px;padding:9px 18px;font-weight:700;font-size:14px;background:var(--ink);color:#fff}.btn.ghost{background:var(--chip);color:var(--ink)}
.meta{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:flex;gap:6px;align-items:center}
.why{color:var(--soft);font-size:15px;line-height:1.5}

/* filter row (round 9 A) */
.filters{margin-top:22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.filters .grp{display:flex;gap:6px;padding-right:12px;border-right:1px solid var(--line)}
.filters .grp:last-child{border-right:0}
.c{border:1px solid #e5e5e5;border-radius:99px;padding:8px 14px;font-weight:600;font-size:14px;background:#fff;display:inline-flex;gap:6px;align-items:center;transition:background .2s,color .2s}
.c .n{font:700 11px Inter;color:var(--muted)}
.c.on{background:var(--ink);color:#fff;border-color:var(--ink)}.c.on .n{color:#bbb}
.c.soft{background:var(--chip);border-color:transparent}.c.soft.on{background:var(--ink)}

/* photos instead of colour tiles */
.ph{position:relative;border-radius:14px;overflow:hidden;background:#ddd;aspect-ratio:16/9}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .4s,transform .4s}
.ph .badge{position:absolute;left:10px;top:10px;color:#fff;font:900 15px 'Inter Tight';padding:4px 10px;border-radius:99px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.ph .badge small{font:800 9px Inter;letter-spacing:1px;margin-left:3px}
.ph .credit{position:absolute;right:8px;bottom:6px;font:600 10px Inter;color:#fff;opacity:.85;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.hi{background:linear-gradient(135deg,#ff416c,#ff4b2b)}.md{background:linear-gradient(135deg,#f7971e,#ff6a00)}.lo{background:linear-gradient(135deg,#f6b93b,#e8a33d)}.mn{background:linear-gradient(135deg,#9aa0a6,#6b7280)}
.new{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px #ffe3d6}
.newtag{font:800 10px Inter;letter-spacing:1px;color:var(--accent)}

/* layout */
.page{display:grid;grid-template-columns:1fr 360px;gap:40px;margin-top:24px;align-items:start}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.card{position:relative;transition:opacity .4s,transform .4s cubic-bezier(.2,.8,.2,1),filter .4s}
.card h3{font:700 18px/1.22 'Inter Tight';margin:10px 0 6px;letter-spacing:-.2px;transition:color .3s}
.card.seen h3{color:#777}
.card.seen img{filter:saturate(.35)}
.card.done{opacity:.45}
.card.done img{filter:grayscale(1)}
.lead{grid-column:1/-1;display:grid;grid-template-columns:1.25fr 1fr;gap:24px;align-items:center}
.lead h3{font:800 30px/1.1 'Inter Tight';letter-spacing:-.8px}
.chk{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35);color:#fff;display:grid;place-items:center;z-index:2;backdrop-filter:blur(4px);transition:background .25s,transform .15s}
.chk:hover{transform:scale(1.08)}
.chk svg{width:18px;height:18px}
.chk svg path{stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .35s ease .05s}
.card.done .chk{background:var(--up);border-color:var(--up)}
.card.done .chk svg path,.chk:hover svg path{stroke-dashoffset:0}
.chk:hover svg path{opacity:.7}.card.done .chk svg path{opacity:1}
.later-tag{display:inline-flex;gap:4px;align-items:center;font:800 10px Inter;letter-spacing:.8px;color:#7c3aed;background:#ede9fe;padding:3px 8px;border-radius:99px}

/* A: progress */
.prog{margin-top:20px;border:1px solid var(--line);border-radius:14px;padding:14px 18px;display:flex;gap:18px;align-items:center}
.prog b{font:800 16px 'Inter Tight';white-space:nowrap}
.prog .bar{flex:1;height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--up);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.prog small{font:600 13px Inter;color:var(--muted);white-space:nowrap}

/* B: queue panel */
.queue{border:1px solid var(--line);border-radius:16px;padding:16px;position:sticky;top:60px}
.queue h2{font:800 20px 'Inter Tight';display:flex;justify-content:space-between;align-items:baseline}
.queue h2 small{font:600 12px Inter;color:var(--muted)}
.q{display:grid;grid-template-columns:26px 64px 1fr 32px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);transition:opacity .35s,transform .35s cubic-bezier(.2,.8,.2,1),max-height .35s,padding .35s;max-height:180px;overflow:hidden}
.q:first-of-type{border-top:0}
.q .k{font:900 20px 'Inter Tight';color:var(--accent)}
.q img{width:64px;height:44px;object-fit:cover;border-radius:8px}
.q b{font:700 14px/1.25 'Inter Tight';display:block}
.q small{font:600 11px Inter;color:var(--muted)}
.q.next{background:#fff7f2;margin:0 -16px;padding:12px 16px;border-top-color:transparent}
.q.next .nexttag{font:800 10px Inter;letter-spacing:1px;color:var(--accent)}
.q.gone{opacity:0;transform:translateX(40px);max-height:0;padding:0}
.qchk{width:30px;height:30px;border-radius:50%;border:2px solid #ddd;background:#fff;color:#ccc;display:grid;place-items:center;transition:border-color .2s,background .2s}
.qchk:hover{border-color:var(--up);background:#dcfce7;color:var(--up)}
.qsec{font:800 11px Inter;letter-spacing:1px;color:var(--muted);margin:14px 0 4px}
.caught{text-align:center;padding:16px 0;font:700 15px 'Inter Tight';color:var(--up)}

/* C: triage */
.tri{display:flex;gap:6px;margin-top:8px}
.tri button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 0;font-weight:700;font-size:12px;color:var(--soft);transition:background .2s,color .2s,border-color .2s}
.tri button:hover{border-color:#ccc;color:var(--ink)}
.tri .d:hover{background:#dcfce7;border-color:#86efac;color:#166534}
.tri .l:hover{background:#ede9fe;border-color:#c4b5fd;color:#5b21b6}
.card.out{opacity:0;transform:scale(.9) translateY(10px)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;border-radius:99px;padding:11px 18px;font-weight:700;font-size:14px;display:flex;gap:14px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:50;animation:tin .35s cubic-bezier(.2,.8,.2,1)}
.toast button{border:0;background:none;color:#ff8a5c;font-weight:800}

/* D: briefing */
.brief-cta{margin-top:20px;border-radius:18px;padding:22px 26px;background:#111;color:#fff;display:flex;gap:24px;align-items:center}
.brief-cta h2{font:800 24px 'Inter Tight';letter-spacing:-.5px}
.brief-cta p{color:#aaa;font-size:14px;margin-top:4px}
.brief-cta .thumbs{display:flex;margin-left:auto}
.brief-cta .thumbs img{width:54px;height:54px;border-radius:50%;object-fit:cover;border:3px solid #111;margin-left:-14px}
.brief-cta .go{background:var(--accent);color:#fff;border:0;border-radius:99px;padding:12px 22px;font-weight:800;font-size:15px}
.ov{position:fixed;inset:0;background:rgba(10,10,10,.55);backdrop-filter:blur(6px);z-index:80;display:grid;place-items:center;animation:fade .25s}
.sheet{width:min(760px,calc(100vw - 32px));background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pop .4s cubic-bezier(.2,.8,.2,1)}
.sheet .ph{border-radius:0;aspect-ratio:21/9}
.sheet .body{padding:22px 26px 24px}
.sheet h2{font:800 28px/1.12 'Inter Tight';letter-spacing:-.6px;margin:8px 0 12px}
.sheet ul{margin-left:18px;color:var(--soft);line-height:1.55;font-size:15px}
.sheet .act{display:flex;gap:10px;margin-top:20px;align-items:center}
.sheet .act .later{background:var(--chip);color:var(--ink)}
.sheet .act .done{background:var(--up)}
.dots{display:flex;gap:6px;margin-right:auto}
.dots i{width:28px;height:5px;border-radius:9px;background:#e5e5e5;transition:background .3s}
.dots i.on{background:var(--ink)}.dots i.ok{background:var(--up)}.dots i.lt{background:#c4b5fd}
.sheet.slide{animation:slide .35s cubic-bezier(.2,.8,.2,1)}
.end{padding:40px 30px;text-align:center}
.end .big{font-size:48px}.end h2{margin-top:8px}

@keyframes tin{from{opacity:0;transform:translate(-50%,16px)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.97)}}
@keyframes slide{from{opacity:0;transform:translateX(60px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="sw"><div class="wrap"><b>Reading status</b><span id="sw"></span><button id="reset">↻ Reset</button><span class="hint">← → switch · try the ✓ / Later buttons · photos are random samples</span></div></div>
<div class="desc"><div class="wrap" id="desc"></div></div>
<header><div class="wrap nav"><span class="logo">investment center</span>
  <nav><a class="on">My News</a><a class="soon">World Brief<small>SOON</small></a><a class="soon">Charts<small>SOON</small></a></nav>
  <div class="r"><a class="btn ghost">Topics &amp; watchlist</a><button class="btn">Sign out</button></div></div></header>
<div class="wrap" id="app"></div>
<script>
const OPTS = [
  ["a", "A. Inbox ticks", "Every story gets a ✓ circle on its photo. NEW dot = arrived since your last visit; opening a story greys its title (seen); ✓ marks it done (fades out, photo goes grey). A bar on top tracks today's must-reads (impact 7+). Filters gain Unread / Later / Done. Simple, stays like today's page."],
  ["b", "B. Read-first queue", "The right column becomes your reading queue: unread must-reads ranked by impact + your watchlist, with 'Next up' highlighted. Tick ✓ and the item slides out and the next moves up; 'Later' items wait underneath; you get 'All caught up' at the end. Tells you exactly what to read first."],
  ["c", "C. Triage buttons", "Like email: every card has ✓ Done · ⏱ Later · ★ Save under it, and tabs Unread / Later / Done at the top. Done or Later makes the card shrink out of the grid (with Undo). Fastest for clearing lots of news; busiest cards."],
  ["d", "D. Morning briefing", "A dark 'Start briefing' bar shows how many must-reads are waiting and how long they take. It opens one story at a time, big photo + key points, with Later / Done ✓ and progress dashes; ends with 'You're caught up'. The feed below still shows NEW dots and ticks. Most guided; an extra step to start."],
];
// sample stories; photos are random samples (picsum) - the real build would pick related photos
const BASE = [
  { id: 1, h: "Nvidia guides above estimates as data-centre demand stays hot", imp: 9, t: "Tech & chips", tk: "NVDA", ago: "2h", src: 7, p: "chip", st: "new", pts: ["Revenue guide ~8% above estimates", "Data-centre sales grew again", "Supply, not demand, is the limit"] },
  { id: 2, h: "Bank of Thailand holds policy rate at 1.75%", imp: 7, t: "Thai economy & BOT", tk: "KBANK", ago: "3h", src: 5, p: "bank", st: "new", pts: ["Vote 5-2 to hold", "Growth forecast cut to 2.4%", "Next meeting in 6 weeks"] },
  { id: 3, h: "Oil jumps 3% after OPEC+ extends output cuts", imp: 7, t: "Energy & oil", tk: "PTT", ago: "4h", src: 6, p: "oil", st: "seen", pts: ["Cuts extended to March", "Brent above $78", "Good for PTT upstream"] },
  { id: 4, h: "Fed holds rates, signals two cuts next year", imp: 8, t: "Global macro & Fed", tk: "SET", ago: "1h", src: 6, p: "fed", st: "new", pts: ["Rates unchanged", "Dot plot shows 2 cuts", "Dollar slipped after"] },
  { id: 5, h: "KBANK posts record quarterly profit", imp: 6, t: "Banking", tk: "KBANK", ago: "5h", src: 3, p: "money", st: "done", pts: ["Profit +18% y/y", "Bad-loan costs lower", "Dividend unchanged"] },
  { id: 6, h: "Apple shifts more iPhone assembly to India", imp: 5, t: "Tech & chips", tk: "AAPL", ago: "6h", src: 4, p: "phone", st: "later", pts: ["~25% of iPhones by 2027", "Tariff risk lower", "Foxconn expands"] },
  { id: 7, h: "Gold hits a new high as the dollar weakens", imp: 5, t: "Commodities & gold", tk: "GOLD", ago: "7h", src: 4, p: "gold", st: "new", pts: ["Spot above $2,700", "Central banks buying", "Dollar index -0.6%"] },
  { id: 8, h: "China factory activity shrinks for a third month", imp: 6, t: "China economy", tk: "CHINA", ago: "8h", src: 3, p: "factory", st: "seen", pts: ["PMI 49.3", "Export orders weak", "Stimulus hopes rise"] },
  { id: 9, h: "CP All expands 7-Eleven delivery to 20 more provinces", imp: 3, t: "SET / Thai market", tk: "CPALL", ago: "9h", src: 2, p: "store", st: "new", pts: ["20 new provinces", "Delivery sales +30%", "Small impact on margins"] },
];
let S = { o: "a", f: "Unread", stories: [], bi: 0, briefOpen: false, toast: null };
const reset = () => { S.stories = BASE.map((x) => ({ ...x })); S.bi = 0; S.briefOpen = false; };
reset();
const img = (s, w = 800, h = 450) => `https://picsum.photos/seed/ic-${s.p}/${w}/${h}`;
const cls = (i) => (i >= 8 ? "hi" : i >= 6 ? "md" : i >= 4 ? "lo" : "mn");
const photo = (s) => `<div class="ph"><img src="${img(s)}" alt="" loading="lazy"><span class="badge ${cls(s.imp)}">${s.imp}<small>IMPACT</small></span><span class="credit">Photo: sample</span></div>`;
const CHK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
const must = () => S.stories.filter((s) => s.imp >= 7);
const isRead = (s) => s.st === "done" || s.st === "seen";
const prio = (s) => s.imp * 3 + (["NVDA", "PTT", "KBANK", "AAPL", "CPALL"].includes(s.tk) ? 4 : 0);
const metaOf = (s) => `<div class="meta">${s.st === "new" ? '<span class="new"></span><span class="newtag">NEW</span> · ' : ""}${s.t} · ${s.ago} ago · ▲ ${s.src}${s.st === "later" ? ' · <span class="later-tag">⏱ LATER</span>' : ""}</div>`;
const count = (st) => S.stories.filter((s) => (st === "Unread" ? s.st === "new" || s.st === "seen" && false : s.st === st.toLowerCase())).length;

function header(extra = "") {
  const n = { Unread: S.stories.filter((s) => s.st === "new").length, Later: S.stories.filter((s) => s.st === "later").length, Done: S.stories.filter((s) => s.st === "done").length };
  return `<div class="filters"><div class="grp">${["All", "My watchlist", "Saved"].map((c) => `<button class="c soft">${c}</button>`).join("")}</div>
    ${extra === "status" ? `<div class="grp">${["Unread", "Later", "Done"].map((c) => `<button class="c ${S.f === c ? "on" : ""}" data-f="${c}">${c}<span class="n">${n[c]}</span></button>`).join("")}</div>` : ""}
    <div class="grp">${["SET / Thai market", "Global macro & Fed", "Tech & chips", "Energy & oil"].map((c) => `<button class="c">${c}</button>`).join("")}</div></div>`;
}
function card(s, i, opts = {}) {
  return `<div class="card ${s.st === "seen" ? "seen" : ""} ${s.st === "done" ? "done" : ""} ${i === 0 && opts.lead ? "lead" : ""}" data-card="${s.id}">
    <div style="position:relative">${photo(s)}${opts.chk ? `<button class="chk" data-done="${s.id}" title="Mark as read">${CHK}</button>` : ""}</div>
    <div>${metaOf(s)}<h3 data-open="${s.id}" style="cursor:pointer">${s.h}</h3>${i === 0 && opts.lead ? `<p class="why">Signals AI spending is still accelerating; chip suppliers and Thai electronics makers could benefit.</p>` : ""}
    ${opts.tri ? `<div class="tri"><button class="d" data-done="${s.id}">✓ Done</button><button class="l" data-later="${s.id}">⏱ Later</button><button>☆ Save</button></div>` : ""}</div></div>`;
}

function A() {
  const m = must(), read = m.filter(isRead).length;
  return `${header("status")}
    <div class="prog"><b>Today's must-reads</b><div class="bar"><i style="width:${(read / m.length) * 100}%"></i></div><small>${read} of ${m.length} read · impact 7+</small></div>
    <div class="grid" style="margin-top:24px">${S.stories.map((s, i) => card(s, i, { chk: true, lead: true })).join("")}</div>`;
}
function B() {
  const unread = S.stories.filter((s) => s.st === "new" || s.st === "seen").sort((a, b) => prio(b) - prio(a));
  const later = S.stories.filter((s) => s.st === "later");
  const q = (s, k, next) => `<div class="q ${next ? "next" : ""}" data-q="${s.id}"><span class="k">${k}</span><img src="${img(s, 160, 110)}" alt=""><span>${next ? '<span class="nexttag">NEXT UP · </span>' : ""}<b>${s.h}</b><small>${s.imp} impact · ${s.t}${s.st === "seen" ? " · opened" : ""}</small></span><button class="qchk" data-done="${s.id}" title="Done">${CHK}</button></div>`;
  return `${header()}<div class="page"><div class="grid">${S.stories.map((s, i) => card(s, i, { lead: true })).join("")}</div>
    <aside class="queue"><h2>Read first <small>${unread.length} unread · ~${unread.length} min</small></h2>
      ${unread.length ? unread.slice(0, 6).map((s, i) => q(s, i + 1, i === 0)).join("") : `<div class="caught">✓ All caught up</div>`}
      ${later.length ? `<div class="qsec">LATER (${later.length})</div>${later.map((s) => q(s, "⏱", false)).join("")}` : ""}
    </aside></div>`;
}
function C() {
  const list = S.stories.filter((s) => (S.f === "Unread" ? s.st === "new" || s.st === "seen" : s.st === S.f.toLowerCase()));
  return `${header("status")}<div class="grid" style="margin-top:24px">${list.map((s, i) => card(s, i, { tri: true, lead: S.f === "Unread" })).join("") || `<p class="why">Nothing here.</p>`}</div>`;
}
function D() {
  const m = must().filter((s) => s.st !== "done" && s.st !== "later");
  return `<div class="brief-cta"><div><h2>${m.length ? `${m.length} must-reads waiting` : "You're caught up ✓"}</h2><p>Impact 7+ news since your last visit · about ${m.length * 1} min</p></div>
      <div class="thumbs">${m.slice(0, 4).map((s) => `<img src="${img(s, 120, 120)}" alt="">`).join("")}</div>
      ${m.length ? `<button class="go" data-brief>▶ Start briefing</button>` : ""}</div>
    ${header()}<div class="grid" style="margin-top:24px">${S.stories.map((s, i) => card(s, i, { chk: true, lead: true })).join("")}</div>
    ${S.briefOpen ? briefing() : ""}`;
}
function briefing() {
  const m = must().sort((a, b) => prio(b) - prio(a));
  const s = m[S.bi];
  const dots = m.map((x, i) => `<i class="${x.st === "done" ? "ok" : x.st === "later" ? "lt" : i === S.bi ? "on" : ""}"></i>`).join("");
  if (!s) return `<div class="ov" data-close><div class="sheet"><div class="end"><div class="big">✓</div><h2>You're caught up</h2><p class="why">${S.stories.filter((x) => x.imp < 7 && x.st === "new").length} lower-impact stories left for when you have time.</p><div class="act" style="justify-content:center"><button class="btn" data-close>Back to My News</button></div></div></div></div>`;
  return `<div class="ov"><div class="sheet slide">${photo(s)}<div class="body">${metaOf(s)}<h2>${s.h}</h2><ul>${s.pts.map((p) => `<li>${p}</li>`).join("")}</ul>
    <div class="act"><div class="dots">${dots}</div><button class="btn later" data-blater="${s.id}">⏱ Later</button><button class="btn done" data-bdone="${s.id}">✓ Done · next</button></div></div></div></div>`;
}

function render() {
  document.getElementById("sw").innerHTML = OPTS.map(([k, n]) => `<button class="${k === S.o ? "on" : ""}" data-o="${k}">${n}</button>`).join(" ");
  document.getElementById("desc").textContent = OPTS.find((x) => x[0] === S.o)[2];
  document.getElementById("app").innerHTML = { a: A, b: B, c: C, d: D }[S.o]() + (S.toast ? `<div class="toast">${S.toast}<button data-undo>Undo</button></div>` : "");
}
let undo = null, tt = null;
function setSt(id, st, animateOut) {
  const s = S.stories.find((x) => x.id === id); const prev = s.st;
  const go = () => { s.st = st; render(); };
  undo = () => { s.st = prev; S.toast = null; render(); };
  if (animateOut) {
    const el = document.querySelector(animateOut.replace("ID", id));
    if (el) { el.classList.add(animateOut.includes("q") ? "gone" : "out"); setTimeout(go, 350); } else go();
    S.toast = st === "done" ? "✓ Marked as read" : "⏱ Saved for later";
    clearTimeout(tt); tt = setTimeout(() => { S.toast = null; render(); }, 4000);
  } else go();
}
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-o],[data-f],[data-done],[data-later],[data-open],[data-brief],[data-bdone],[data-blater],[data-close],[data-undo],#reset");
  if (!el) return;
  if (el.id === "reset") { reset(); S.toast = null; return render(); }
  if (el.dataset.o) { S.o = el.dataset.o; S.f = "Unread"; S.toast = null; return render(); }
  if (el.dataset.f) { S.f = el.dataset.f; return render(); }
  if (el.dataset.undo !== undefined) return undo && undo();
  if (el.dataset.open) { const s = S.stories.find((x) => x.id === +el.dataset.open); if (s.st === "new") s.st = "seen"; return render(); }
  if (el.dataset.done) {
    const id = +el.dataset.done, s = S.stories.find((x) => x.id === id);
    if (S.o === "a" || S.o === "d") { s.st = s.st === "done" ? "seen" : "done"; return render(); }
    if (S.o === "b") return setSt(id, "done", '[data-q="ID"]');
    return setSt(id, "done", '[data-card="ID"]');
  }
  if (el.dataset.later) return setSt(+el.dataset.later, "later", '[data-card="ID"]');
  if (el.dataset.brief !== undefined) { S.briefOpen = true; S.bi = 0; return render(); }
  if (el.dataset.bdone || el.dataset.blater) { const s = S.stories.find((x) => x.id === +(el.dataset.bdone || el.dataset.blater)); s.st = el.dataset.bdone ? "done" : "later"; S.bi++; return render(); }
  if (el.dataset.close !== undefined && (e.target === el || el.tagName === "BUTTON")) { S.briefOpen = false; return render(); }
});
document.addEventListener("keydown", (e) => { const i = OPTS.findIndex((x) => x[0] === S.o); if (e.key === "ArrowRight") S.o = OPTS[(i + 1) % 4][0]; else if (e.key === "ArrowLeft") S.o = OPTS[(i + 3) % 4][0]; else return; S.toast = null; render(); });
const u = new URLSearchParams(location.search); if (u.get("o")) S.o = u.get("o"); if (u.get("brief")) S.briefOpen = true;
render();
</script>
