<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;background:#fff}
a{color:inherit;text-decoration:none;cursor:pointer}
button{cursor:pointer}
/* switcher */
#sw{position:sticky;top:0;z-index:99;background:#111;color:#fff;display:flex;align-items:center;gap:6px;padding:8px 14px;font:500 13px Inter;flex-wrap:wrap}
#sw b{margin:0 8px 0 4px;color:#aaa;font-weight:600}
#sw button{font:600 12px Inter;border:0;border-radius:6px;padding:7px 11px;background:#2a2a2a;color:#ddd}
#sw button.on{background:#fff;color:#111}
#sw .sep{width:1px;height:22px;background:#444;margin:0 8px}
#sw .note{margin-left:auto;color:#aaa;font-size:12px}
#desc{background:#fffbe6;border-bottom:1px solid #eee;padding:8px 14px;font:13px Inter;color:#333}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px}
.img{border-radius:inherit;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:16px;color:#fff;font:800 28px 'Inter Tight'}
.img small{position:absolute;top:14px;left:16px;font:700 11px Inter;letter-spacing:1px;text-transform:uppercase;opacity:.85}
.faded{opacity:.38}
.taste h4{margin-bottom:8px}
.taste p{line-height:1.45}
.taste .tg{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;margin:2px 4px 2px 0}

/* ============ 1 DIGG ============ */
.s1{background:#fff;color:#111;padding-bottom:60px}
.s1 header{border-bottom:1px solid #eee}
.s1 .nav{display:flex;align-items:center;gap:32px;height:68px}
.s1 .logo{font:900 24px 'Inter Tight';letter-spacing:-1px}
.s1 .nav nav{display:flex;gap:24px;font-weight:600;font-size:15px;color:#555}
.s1 .nav nav .on{color:#111;border-bottom:2px solid #111;padding-bottom:22px;margin-bottom:-24px}
.s1 .nav .r{margin-left:auto;display:flex;gap:12px;align-items:center}
.s1 .srch{background:#f3f3f3;border-radius:99px;padding:9px 16px;width:240px;color:#999;font-size:14px}
.s1 .btn{background:#111;color:#fff;border-radius:99px;padding:9px 18px;font-weight:700;font-size:14px}
.s1 .chips{display:flex;gap:8px;margin-top:24px}
.s1 .chip{border:1px solid #e5e5e5;border-radius:99px;padding:7px 16px;font-weight:600;font-size:14px}
.s1 .chip.on{background:#111;color:#fff;border-color:#111}
.s1 .hero{display:grid;grid-template-columns:1.6fr 1fr;gap:40px;margin-top:24px}
.s1 .hero .img{height:400px;border-radius:16px;font-size:64px}
.s1 .hero h1{font:800 38px/1.1 'Inter Tight';letter-spacing:-1px;margin:18px 0 10px}
.s1 .meta{font-size:13px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.5px}
.s1 .why{color:#555;font-size:16px;line-height:1.5}
.s1 .trend h2{font:800 20px 'Inter Tight';margin-bottom:6px}
.s1 .trend li{list-style:none;display:grid;grid-template-columns:40px 1fr;padding:16px 0;border-bottom:1px solid #eee}
.s1 .trend .n{font:900 28px 'Inter Tight';color:#ff4500}
.s1 .trend h3{font:700 17px/1.25 'Inter Tight'}
.s1 .vote{font-size:13px;font-weight:700;margin-top:6px}
.s1 .sec{font:800 24px 'Inter Tight';margin:56px 0 18px}
.s1 .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.s1 .card .img{height:190px;border-radius:12px;font-size:34px}
.s1 .card h3{font:700 20px/1.2 'Inter Tight';margin:12px 0 8px;letter-spacing:-.3px}
.s1 .two{display:grid;grid-template-columns:1fr 340px;gap:48px;margin-top:32px;align-items:start}
.s1 .pt{font:800 44px/1.05 'Inter Tight';letter-spacing:-1.5px;margin:10px 0 10px}
.s1 .wrow{display:grid;grid-template-columns:56px 1fr;padding:22px 0;border-bottom:1px solid #eee}
.s1 .wrow .n{font:900 34px 'Inter Tight';color:#ff4500;line-height:1}
.s1 .wrow h3{font:700 22px/1.2 'Inter Tight';letter-spacing:-.3px;margin:6px 0 6px}
.s1 .wrow .sum{color:#555;font-size:15px;line-height:1.5}
.s1 .rate{display:flex;gap:8px;margin-top:12px}
.s1 .rb{border:1px solid #ddd;border-radius:99px;padding:6px 14px;font:700 13px Inter;background:#fff;color:#111}
.s1 .rb.rw.on{background:#ff4500;border-color:#ff4500;color:#fff}
.s1 .rb.rn.on{background:#111;border-color:#111;color:#fff}
.s1 .side{background:#f6f6f6;border-radius:16px;padding:24px;position:sticky;top:110px}
.s1 .side h4{font:800 18px 'Inter Tight'}
.s1 .side p{font-size:14px;color:#555}
.s1 .side small{display:block;margin-top:14px;font-size:12px;color:#999}
.s1 .tg.more{background:#ffe3d6;color:#c33600}.s1 .tg.less{background:#e9e9e9;color:#555}
.s1 .cc{border:1px solid #eee;border-radius:16px;padding:22px}
.s1 .qh{display:flex;align-items:baseline;gap:12px}
.s1 .qh .sx{font:800 26px 'Inter Tight'}
.s1 .qh .nm{color:#888;font-weight:600}
.s1 .qp{display:flex;align-items:baseline;gap:14px;margin:6px 0 14px}
.s1 .qp b{font:800 40px 'Inter Tight';letter-spacing:-1px}
.s1 .qp span{font-weight:700;font-size:16px}
.s1 .qp em{font-style:normal;margin-left:auto;font-size:12px;color:#aaa}
.s1 .rng{display:flex;gap:6px;margin-bottom:10px}
.s1 .rng button{border:0;background:#f3f3f3;border-radius:99px;padding:6px 14px;font:700 13px Inter;color:#555}
.s1 .rng button.on{background:#111;color:#fff}
.s1 .wl h2{font:800 20px 'Inter Tight';margin-bottom:8px}
.s1 .wl li{list-style:none;display:grid;grid-template-columns:1fr 90px 92px;align-items:center;gap:10px;padding:13px 12px;border-radius:12px;cursor:pointer}
.s1 .wl li.on{background:#f6f6f6}
.s1 .wl small{display:block;font-size:12px;color:#999;font-weight:600}
.s1 .wl .r{text-align:right;font-size:14px}
.s1 .wl .r span{display:block;font-weight:700;font-size:13px}
.s1 .ks{width:100%;border-collapse:collapse;font-size:14px}
.s1 .ks td{padding:11px 12px;border-bottom:1px solid #eee;color:#555}
.s1 .ks td+td{text-align:right;font-weight:700;color:#111}
.s3 .ks td+td{text-align:right;font-weight:600}
.s3 .ks tr{cursor:default}
.s1 .rc{border:1px solid #eee;border-radius:12px;padding:20px}
.s1 .rc h3{font:700 19px/1.25 'Inter Tight';margin-top:8px}

/* ============ 3 MAGAZINE ============ */
.s3{background:#fff;color:#121212;padding-bottom:60px;font-family:'Source Serif 4'}
.s3 .redbar{height:6px;background:#e3120b}
.s3 .mast{display:flex;align-items:flex-end;justify-content:space-between;padding:22px 0 14px;border-bottom:1px solid #121212}
.s3 .mast h1{font:900 50px Fraunces;letter-spacing:-2px}
.s3 .mast nav{display:flex;gap:24px;font:600 14px Inter;padding-bottom:8px}
.s3 .mast nav .on{color:#e3120b;box-shadow:0 2px 0 #e3120b}
.s3 .date{font:500 13px Inter;color:#666;padding:10px 0;border-bottom:1px solid #ddd}
.s3 .lay{display:grid;grid-template-columns:2fr 1fr 1fr;gap:32px;margin-top:28px}
.s3 .lead{grid-row:span 2}
.s3 .lead .img{height:380px;font-size:72px}
.s3 .kick{font:700 12px Inter;color:#e3120b;text-transform:uppercase;letter-spacing:1px;margin:14px 0 6px}
.s3 .lead h2{font:900 42px/1.05 Fraunces;letter-spacing:-1px}
.s3 h3{font:700 22px/1.15 Fraunces}
.s3 p{font-size:16px;line-height:1.5;color:#444;margin-top:8px;font-style:italic}
.s3 .art{border-top:1px solid #121212;padding-top:4px}
.s3 .src{font:500 12px Inter;color:#888;margin-top:8px}
.s3 .row{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;margin-top:44px;border-top:4px solid #121212;padding-top:4px}
.s3 .two{display:grid;grid-template-columns:1fr 300px;gap:48px;margin-top:28px;align-items:start}
.s3 .pt{font:900 46px/1.02 Fraunces;letter-spacing:-1.5px;margin-top:6px}
.s3 .wg{display:grid;grid-template-columns:1fr 1fr;gap:28px 32px;margin-top:24px}
.s3 .wg .art h3{font-size:25px}
.s3 .rate{margin-top:10px;font:600 13px Inter;display:flex;gap:16px}
.s3 .rb{background:none;border:0;font:600 13px Inter;color:#888;padding:0;border-bottom:1px solid #ccc}
.s3 .rb.rw.on{color:#e3120b;border-color:#e3120b}
.s3 .rb.rn.on{color:#121212;border-color:#121212}
.s3 .side{border-top:4px solid #121212;padding-top:10px;position:sticky;top:110px}
.s3 .side h4{font:700 12px Inter;color:#e3120b;text-transform:uppercase;letter-spacing:1px}
.s3 .side p{font-size:16px}
.s3 .side small{display:block;font:500 12px Inter;color:#888;margin-top:12px}
.s3 .tg{font-family:Inter;font-style:normal}
.s3 .tg.more{background:#fde3e1;color:#b50e08}.s3 .tg.less{background:#eee;color:#555}
.s3 .qp{display:flex;align-items:baseline;gap:16px;margin:4px 0 14px;font-family:Inter}
.s3 .qp b{font:700 34px Fraunces}
.s3 .qp span{font-weight:700}
.s3 .qp em{margin-left:auto;font:italic 13px 'Source Serif 4';color:#888}
.s3 .rng{display:flex;gap:18px;font:600 13px Inter;border-bottom:1px solid #121212;padding-bottom:8px;margin-bottom:12px}
.s3 .rng button{background:none;border:0;font:600 13px Inter;color:#888;padding:0}
.s3 .rng button.on{color:#e3120b}
.s3 table{width:100%;border-collapse:collapse;font-family:Inter;font-size:14px}
.s3 td{padding:12px 4px;border-bottom:1px solid #ddd;vertical-align:middle}
.s3 tr{cursor:pointer}
.s3 tr.on td{background:#faf6f0}
.s3 td small{display:block;color:#888;font-size:11px}
.s3 td.r{text-align:right;font-weight:600}
.s3 .rel{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;margin-top:44px;border-top:4px solid #121212;padding-top:4px}

/* ============ 5 BENTO ============ */
.s5{background:#efece6;color:#141414;font-family:'Space Grotesk';padding-bottom:60px}
.s5 .nav{display:flex;align-items:center;justify-content:space-between;height:76px}
.s5 .logo{font:700 24px 'Space Grotesk'}
.s5 nav{display:flex;gap:8px}
.s5 nav a{background:#fff;padding:8px 18px;border-radius:99px;font-size:14px;font-weight:500}
.s5 nav a.on{background:#141414;color:#fff}
.s5 .chips{display:flex;gap:6px;margin-bottom:18px}
.s5 .chips span{border:1px solid #14141433;padding:6px 14px;border-radius:99px;font-size:13px;font-weight:500}
.s5 .chips span.on{background:#ff5a1f;border-color:#ff5a1f;color:#fff}
.s5 .greet{font:500 52px/1.05 'Space Grotesk';letter-spacing:-2px;margin:10px 0 26px}
.s5 .greet em{font-style:normal;color:#ff5a1f}
.s5 .bento{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:190px;gap:16px}
.s5 .bento.tall{grid-template-rows:repeat(3,minmax(214px,auto)) auto;grid-auto-rows:auto}
.s5 .t{border-radius:28px;padding:22px;display:flex;flex-direction:column;justify-content:space-between;background:#fff;gap:10px;overflow:hidden}
.s5 .t small{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;opacity:.7}
.s5 .t h3{font:500 21px/1.2 'Space Grotesk'}
.s5 .big{font:700 64px 'Space Grotesk';letter-spacing:-3px;line-height:1}
.s5 .big sub{font-size:16px;letter-spacing:0;vertical-align:baseline;margin-left:6px;opacity:.7;font-weight:500}
.s5 .w2{grid-column:span 2}.s5 .w3{grid-column:span 3}.s5 .w4{grid-column:span 4}.s5 .h2{grid-row:span 2}
.s5 .dark{background:#141414;color:#fff}.s5 .org{background:#ff5a1f;color:#fff}.s5 .lime{background:#d4f25c}.s5 .sky{background:#bfe0ff}
.s5 .why{font-size:14px;opacity:.8;line-height:1.4}
.s5 .rate{display:flex;gap:8px}
.s5 .rb{border:1.5px solid currentColor;background:transparent;color:inherit;border-radius:99px;padding:6px 14px;font:700 13px 'Space Grotesk'}
.s5 .rb.on{background:currentColor}
.s5 .rb.on span{filter:invert(1)}
.s5 .dark .rb.on span,.s5 .org .rb.on span{filter:none;color:#141414}
.s5 .t:not(.dark):not(.org) .rb.on span{color:#fff;filter:none}
.s5 .taste{flex-direction:row;align-items:center;justify-content:flex-start;gap:40px}
.s5 .taste h4{font:700 26px 'Space Grotesk';margin:0;min-width:200px}
.s5 .taste p{font-size:16px}
.s5 .tg.more{background:#ff5a1f;color:#fff}.s5 .tg.less{background:#14141422;color:#141414}
.s5 .qtop{display:flex;justify-content:space-between;align-items:flex-start}
.s5 .rng{display:flex;gap:6px}
.s5 .rng button{border:0;background:#2a2a2a;color:#aaa;border-radius:99px;padding:6px 14px;font:700 13px 'Space Grotesk'}
.s5 .rng button.on{background:#d4f25c;color:#141414}
.s5 .wl{justify-content:flex-start}
.s5 .wl li{list-style:none;display:grid;grid-template-columns:1fr 70px 80px;align-items:center;gap:8px;padding:9px 10px;border-radius:14px;cursor:pointer;font-size:14px}
.s5 .wl li.on{background:#efece6}
.s5 .wl li .r{text-align:right}
.s5 .wl li .r span{display:block;font-size:12px;font-weight:700}

/* ============ 7 SWISS ============ */
.s7{background:#fff;color:#000;font-family:'Inter Tight';padding-bottom:60px}
.s7 .top{display:grid;grid-template-columns:repeat(12,1fr);gap:0 20px;border-bottom:2px solid #000;padding:18px 0;font:700 13px Inter;text-transform:uppercase;letter-spacing:.5px}
.s7 .top .logo{grid-column:span 4;font:900 15px Inter}
.s7 .top a,.s7 .top span{grid-column:span 2}
.s7 .top a.on{color:#ff2d00}
.s7 .top .dt{text-align:right}
.s7 .hero{display:grid;grid-template-columns:repeat(12,1fr);gap:0 20px;padding:36px 0;border-bottom:2px solid #000}
.s7 .hero .no{grid-column:span 2;font:900 120px/0.8 'Inter Tight';color:#ff2d00}
.s7 .hero h1{grid-column:span 8;font:900 76px/0.92 'Inter Tight';letter-spacing:-3px;text-transform:uppercase}
.s7 .hero .side{grid-column:span 2;font:500 14px/1.4 Inter;align-self:end}
.s7 .list{display:grid;grid-template-columns:repeat(3,1fr)}
.s7 .c{border-bottom:1px solid #000;border-right:1px solid #000;padding:22px 22px 26px}
.s7 .c:nth-child(3n){border-right:0}
.s7 .c .no{font:900 34px 'Inter Tight'}
.s7 .c .lab{font:700 11px Inter;text-transform:uppercase;letter-spacing:1px;margin:10px 0 6px}
.s7 .c .lab b{color:#ff2d00}
.s7 .c h3{font:800 24px/1.05 'Inter Tight';letter-spacing:-.5px;text-transform:uppercase}
.s7 .c p{font:14px/1.4 Inter;margin-top:10px}
.s7 .chips{display:grid;grid-template-columns:repeat(12,1fr);gap:0 20px;border-bottom:1px solid #000;padding:10px 0;font:700 12px Inter;text-transform:uppercase;letter-spacing:1px}
.s7 .chips span{grid-column:span 2}
.s7 .chips span.on{color:#ff2d00}
.s7 .wr{display:grid;grid-template-columns:repeat(12,1fr);gap:0 20px;border-bottom:1px solid #000;padding:24px 0}
.s7 .wr .no{grid-column:span 2;font:900 64px/0.85 'Inter Tight'}
.s7 .wr .mn{grid-column:span 7}
.s7 .wr .lab{font:700 11px Inter;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.s7 .wr .lab b{color:#ff2d00}
.s7 .wr h3{font:900 32px/1 'Inter Tight';letter-spacing:-1px;text-transform:uppercase}
.s7 .wr p{font:15px/1.45 Inter;margin-top:10px;max-width:640px}
.s7 .wr .ac{grid-column:span 3;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.s7 .wr .cnt{font:900 44px/0.9 'Inter Tight'}
.s7 .wr .cnt small{display:block;font:700 11px Inter;letter-spacing:1px;margin-top:4px}
.s7 .rate{display:grid;grid-template-columns:1fr 1fr;gap:0}
.s7 .rb{border:2px solid #000;background:#fff;color:#000;font:800 12px Inter;text-transform:uppercase;letter-spacing:1px;padding:9px 0}
.s7 .rb.rn{border-left:0}
.s7 .rb.rw.on{background:#ff2d00;border-color:#ff2d00;color:#fff}
.s7 .rb.rn.on{background:#000;color:#fff}
.s7 .tst{display:grid;grid-template-columns:repeat(12,1fr);gap:0 20px;background:#ff2d00;color:#fff;padding:26px 0;margin-top:0}
.s7 .tst h4{grid-column:2 / span 3;font:900 32px/1 'Inter Tight';text-transform:uppercase}
.s7 .tst p{grid-column:span 7;font:500 16px/1.45 Inter}
.s7 .tst .tg{background:#fff;color:#000;border-radius:0}
.s7 .tst .tg.less{background:#000;color:#fff}
.s7 .qhero{display:grid;grid-template-columns:repeat(12,1fr);gap:0 20px;padding:30px 0 24px;border-bottom:2px solid #000;align-items:end}
.s7 .qhero .sx{grid-column:span 6;font:900 120px/0.8 'Inter Tight';letter-spacing:-5px}
.s7 .qhero .sx small{display:block;font:700 13px Inter;letter-spacing:1px;margin-bottom:14px}
.s7 .qhero .px{grid-column:span 4;font:900 64px/0.85 'Inter Tight';letter-spacing:-2px}
.s7 .qhero .cg{grid-column:span 2;font:900 32px/1 'Inter Tight';text-align:right}
.s7 .qbody{display:grid;grid-template-columns:repeat(12,1fr);gap:0 20px;border-bottom:2px solid #000}
.s7 .qbody .chartc{grid-column:span 8;border-right:1px solid #000;padding:16px 20px 16px 0}
.s7 .qbody .wlc{grid-column:span 4}
.s7 .rng{display:flex;gap:0;margin-bottom:10px}
.s7 .rng button{border:2px solid #000;background:#fff;font:800 12px Inter;padding:6px 16px;margin-right:-2px}
.s7 .rng button.on{background:#000;color:#fff}
.s7 .rng em{margin-left:auto;font:700 11px Inter;text-transform:uppercase;letter-spacing:1px;align-self:center}
.s7 .wlc h4{font:700 11px Inter;text-transform:uppercase;letter-spacing:1px;padding:16px 0 10px;border-bottom:1px solid #000}
.s7 .wlc li{list-style:none;display:grid;grid-template-columns:1fr 70px 76px;align-items:center;gap:8px;padding:14px 0;border-bottom:1px solid #000;cursor:pointer;font:800 18px 'Inter Tight'}
.s7 .wlc li:last-child{border-bottom:0}
.s7 .wlc li.on{color:#ff2d00}
.s7 .wlc li small{display:block;font:700 10px Inter;letter-spacing:1px;color:#000}
.s7 .wlc li .r{text-align:right;font-size:15px}
.s7 .wlc li .r span{display:block;font-size:12px}
</style>
</head>

/* ---------- fake price series (seeded, deterministic) ---------- */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
SY.forEach((y,k)=>{const r=rng(k*977+11);let c=100;const a=[];for(let i=0;i<120;i++){const o=c;c=o*(1+(r()-0.47)*0.035);a.push({o,c,h:Math.max(o,c)*(1+r()*0.012),l:Math.min(o,c)*(1-r()*0.012),v:0.25+r()})}
 const f=y.p/a[119].c;a.forEach(d=>{d.o*=f;d.h*=f;d.l*=f;d.c*=f});y.d=a;y.chg=(a[119].c-a[118].c)/a[118].c*100});
const fmt=v=>v>=1000?v.toLocaleString('en',{maximumFractionDigits:0}):v.toFixed(2);
const pct=v=>(v>=0?'+':'−')+Math.abs(v).toFixed(2)+'%';

function chart(y,n,o){const H=o.H||380,Wd=900,pr=66,top=10,ph=H-110,vh=56,vb=H-6;const d=y.d.slice(-n);
 const hi=Math.max(...d.map(x=>x.h)),lo=Math.min(...d.map(x=>x.l));const sy=v=>top+(hi-v)/(hi-lo)*ph;const cw=(Wd-pr)/n,bw=Math.max(1.5,cw*0.62);
 let g='';for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,yy=sy(v);const lab=Math.abs(yy-sy(y.p))<18?"":fmt(v);g+=`<line x1="0" x2="${Wd-pr}" y1="${yy}" y2="${yy}" stroke="${o.grid}"/><text x="${Wd-pr+8}" y="${yy+4}" fill="${o.txt}" font-size="12" font-family="${o.font}">${lab}</text>`}
 const vmax=Math.max(...d.map(x=>x.v));let c='';
 d.forEach((x,i)=>{const up=x.c>=x.o,col=up?o.up:o.dn,cx=i*cw+cw/2,vy=vh*x.v/vmax;
  c+=`<rect x="${cx-bw/2}" y="${vb-vy}" width="${bw}" height="${vy}" fill="${col}" opacity=".22"/>`;
  c+=`<line x1="${cx}" x2="${cx}" y1="${sy(x.h)}" y2="${sy(x.l)}" stroke="${col}" stroke-width="1.2"/>`;
  const y1=sy(Math.max(x.o,x.c)),hh=Math.max(1,Math.abs(sy(x.o)-sy(x.c)));
  c+=`<rect x="${cx-bw/2}" y="${y1}" width="${bw}" height="${hh}" fill="${up&&o.hollow?o.bg:col}" stroke="${col}"/>`});
 let ma='';if(o.ma){const off=120-n,pts=[];d.forEach((x,i)=>{const j=off+i;if(j<19)return;let s=0;for(let k=j-19;k<=j;k++)s+=y.d[k].c;const v=Math.min(hi,Math.max(lo,s/20));pts.push(`${(i*cw+cw/2).toFixed(1)},${sy(v).toFixed(1)}`)});ma=`<polyline points="${pts.join(' ')}" fill="none" stroke="${o.ma}" stroke-width="1.6"/>`}
 const ly=sy(y.p),lc=y.chg>=0?o.up:o.dn;
 const last=`<line x1="0" x2="${Wd-pr}" y1="${ly}" y2="${ly}" stroke="${lc}" stroke-dasharray="3 3"/><rect x="${Wd-pr+2}" y="${ly-10}" width="${pr-4}" height="20" fill="${lc}"/><text x="${Wd-pr+8}" y="${ly+4}" fill="${o.lt||'#fff'}" font-size="12" font-weight="700" font-family="${o.font}">${fmt(y.p)}</text>`;
 return `<svg viewBox="0 0 ${Wd} ${H}" width="100%" style="display:block">${g}${c}${ma}${last}</svg>`}
function spark(y,up,dn,w=90,h=30){const d=y.d.slice(-30).map(x=>x.c),hi=Math.max(...d),lo=Math.min(...d);const p=d.map((v,i)=>`${(i*w/29).toFixed(1)},${(2+(hi-v)/(hi-lo)*(h-4)).toFixed(1)}`).join(' ');return `<svg width="${w}" height="${h}" style="display:block"><polyline points="${p}" fill="none" stroke="${y.chg>=0?up:dn}" stroke-width="1.8"/></svg>`}

function taste(){const m=[],l=[];W.forEach((w,i)=>{if(st.rate[i]=='want'&&!m.includes(w.tp))m.push(w.tp);if(st.rate[i]=='no'&&!l.includes(w.tp))l.push(w.tp)});
 const body=m.length||l.length?`${m.length?`More of: ${m.map(t=>`<span class="tg more">${t}</span>`).join('')}<br>`:''}${l.length?`Less of: ${l.map(t=>`<span class="tg less">${t}</span>`).join('')}`:''}`:'Rate a few stories. You will see more of what you want and less of what you don\'t.';
 return {h:'Your taste',body}}
function rb(w,a='Want',b='No want'){return `<div class="rate"><button class="rb rw ${w.r=='want'?'on':''}" onclick="rate(${w.i},'want')"><span>${a}</span></button><button class="rb rn ${w.r=='no'?'on':''}" onclick="rate(${w.i},'no')"><span>${b}</span></button></div>`}

const statsTbl=(y,cls='')=>`<table class="ks ${cls}">${stats(y).map(r=>`<tr><td>${r[0]}</td><td>${y.c}${r[1]}</td></tr>`).join('')}</table>`;

  <div class="wlc"><h4>Watchlist</h4><ul>${SY.map((z,i)=>`<li class="${i==st.sym?'on':''}" onclick="setSym(${i})"><div>${z.s}<small>${z.x}</small></div>${spark(z,'#000','#ff2d00',70,26)}<div class="r">${fmt(z.p)}<span style="color:${z.chg>=0?'#000':'#ff2d00'}">${pct(z.chg)}</span></div></li>`).join('')}</ul></div></div>
  <div class="list">${REL[y.s].map((r,i)=>`<div class="c"><div class="no">${String(i+1).padStart(2,'0')}</div><div class="lab"><b>${y.s}</b> / ${r[1]} / ${r[2]}</div><h3>${r[0]}</h3></div>`).join('')}</div></div></div>`}
 ]}
];
const PD=['<i>My News:</i> your topics, scored for you.','<i>World Brief:</i> top global stories with Want / No want. Try the buttons: No want fades a story and moves it down.','<i>Charts:</i> TradingView-style layout. Click a watchlist row or a range button. The real build would embed TradingView\'s free chart.'];

/* ---------- render ---------- */
function render(keep){const y=window.scrollY;document.getElementById('stage').innerHTML=S[st.s].p[st.p](S[st.s]);document.getElementById('desc').innerHTML=S[st.s].d+' &nbsp;·&nbsp; '+PD[st.p];
 document.getElementById('sb').innerHTML=S.map((s,i)=>`<button class="${i==st.s?'on':''}" onclick="setS(${i})">${s.name}</button>`).join(' ');
 document.getElementById('pb').innerHTML=PG.map((p,i)=>`<button class="${i==st.p?'on':''}" onclick="go(${i})">${p}</button>`).join(' ');
 history.replaceState(null,'','#'+(st.s+1)+'-'+(st.p+1));window.scrollTo(0,keep?y:0)}
function setS(i){st.s=(i+S.length)%S.length;render()}
function go(i){st.p=(i+3)%3;render()}
function rate(i,v){st.rate[i]=st.rate[i]==v?null:v;render(1)}
function setSym(i){st.sym=i;render(1)}
function setRg(k){st.rg=k;render(1)}
document.addEventListener('keydown',e=>{if(e.key=='ArrowRight')setS(st.s+1);if(e.key=='ArrowLeft')setS(st.s-1);if(e.key=='ArrowDown'){e.preventDefault();go(st.p+1)}if(e.key=='ArrowUp'){e.preventDefault();go(st.p-1)}});
const m=location.hash.match(/#(\d)-(\d)/);if(m){st.s=Math.min(3,m[1]-1);st.p=Math.min(2,m[2]-1)}
if(location.hash.includes('demo')){st.rate={3:'want',5:'no'}}
render();
</script>
</body>
</html>
