# GitHub pauses scheduled workflows in public repos after 60 days without repo activity.
# This makes one tiny commit per month so the news robot keeps running.
name: Keep alive

on:
  schedule:
    - cron: "0 3 1 * *"        # 03:00 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/heartbeat.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/heartbeat.txt
          git commit -m "Monthly heartbeat (keeps the scheduled robot active)"
          git push
